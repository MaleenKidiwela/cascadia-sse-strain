[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sse-strain"
version = "0.1.0"
description = "Space-time strain and stress fields from Cascadia slow-slip catalogs (Gualandi 2025 near-real-time solutions)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "matplotlib>=3.7",
    "cutde>=22.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "zarr>=2.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
